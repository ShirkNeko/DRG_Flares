plugins {
    id 'java-library'
    id 'net.neoforged.moddev'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "${project.mod_id}-common-${project.minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    // Vanilla-only mode: provides Mojang-mapped Minecraft for compilation,
    // without any NeoForge patches. Loader-specific code lives in the neoforge project.
    neoFormVersion = project.neo_form_version
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
